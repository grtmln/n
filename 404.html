:root{--f-display:"Syne","Helvetica Neue",Arial,sans-serif;--f-serif:"Syne","Helvetica Neue",Arial,sans-serif;--f-body:"Inter Tight","Helvetica Neue",Arial,sans-serif;--f-mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;--bg:#06060a;--fg:#f2f1ee;--mute:#8d8c92;--line:#ffffff22;--red:#ff2a2a;--blue:#1b4dff;--org:#ff8a1f;--grn:#38d67a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06060a;--fg:#f2f1ee}}:root[data-theme="dark"]{--bg:#06060a;--fg:#f2f1ee}*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}body{background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.5;overflow-x:hidden}.grain{position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.95;mix-blend-mode:overlay;}.bg{position:fixed;inset:0;z-index:-2;overflow:hidden}.blob{position:absolute;border-radius:50%;filter:blur(160px);opacity:.6;will-change:transform}.b1{width:120vmax;height:120vmax;background:radial-gradient(closest-side,var(--red),rgba(255,42,42,.35) 45%,transparent 100%);left:-50vmax;top:-45vmax}.b2{width:110vmax;height:110vmax;background:radial-gradient(closest-side,var(--blue),rgba(27,77,255,.35) 45%,transparent 100%);right:-50vmax;top:-5vmax}.b3{width:100vmax;height:100vmax;background:radial-gradient(closest-side,var(--org),rgba(255,138,31,.3) 45%,transparent 100%);left:-10vmax;bottom:-60vmax}.b4{width:90vmax;height:90vmax;background:radial-gradient(closest-side,var(--grn),rgba(56,214,122,.25) 45%,transparent 100%);right:-30vmax;bottom:-45vmax;opacity:.35}nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 5vw 18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:#06060a44}
.grain{position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.95;mix-blend-mode:overlay;}
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(160px);opacity:.6;will-change:transform}
.b1{width:120vmax;height:120vmax;background:radial-gradient(closest-side,var(--red),rgba(255,42,42,.35) 45%,transparent 100%);left:-50vmax;top:-45vmax}
.b2{width:110vmax;height:110vmax;background:radial-gradient(closest-side,var(--blue),rgba(27,77,255,.35) 45%,transparent 100%);right:-50vmax;top:-5vmax}
.b3{width:100vmax;height:100vmax;background:radial-gradient(closest-side,var(--org),rgba(255,138,31,.3) 45%,transparent 100%);left:-10vmax;bottom:-60vmax}
.b4{width:90vmax;height:90vmax;background:radial-gradient(closest-side,var(--grn),rgba(56,214,122,.25) 45%,transparent 100%);right:-30vmax;bottom:-45vmax;opacity:.35}
nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 5vw 18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:#06060a44}
nav a{color:var(--fg);text-decoration:none;font-size:14px;margin-left:24px;opacity:.8}
nav a:hover{opacity:1}
.logo{display:block;margin:0!important;opacity:1!important}
.logo img{height:22px;width:auto;display:block}
section{padding:14vh 5vw;max-width:1280px;margin:auto}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-top:18vh}

.pill{display:inline-block;margin-top:40px;padding:14px 26px;border:1px solid var(--line);border-radius:99px;color:var(--fg);text-decoration:none;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:#ffffff0f;transition:.3s}.pill:hover{background:var(--fg);color:#000}
#cur{position:fixed;left:0;top:0;width:30px;pointer-events:none;z-index:100;mix-blend-mode:difference;opacity:0;transition:opacity .2s;will-change:transform}
#cur.on{opacity:1}
#cur img{display:block;width:100%;transition:transform .2s}
#cur.big img{transform:scale(1.7)}
@media (hover:hover) and (pointer:fine){html,body,a,button{cursor:none}}
@media (hover:none),(pointer:coarse){#cur{display:none}}


/* top bar (logo + menu) slides in from the top on load */
@keyframes navin{from{transform:translateY(-110%);opacity:0}to{transform:none;opacity:1}}
nav{animation:navin 1.1s cubic-bezier(.16,1,.3,1) .25s backwards}
@media (prefers-reduced-motion:reduce){nav{animation:none}}

/* top bar blends into the page at the very top; once scrolled, a soft panel fades in whose lower edge dissolves gradually (same size as the bar) */
nav,nav.on{background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
nav::before,nav::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .5s ease}
nav::before{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 55%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,#000 55%,transparent 100%)}
nav::after{-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 40%,#000 85%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 40%,#000 85%,transparent 100%)}
nav.on::before,nav.on::after{opacity:1}


/* background layer sized to the large viewport so mobile browser bars do not resize it (look unchanged) */
.bg{top:0;left:0;right:0;bottom:auto;height:100vh;height:100lvh;transform:translateZ(0);backface-visibility:hidden;contain:paint}


body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
nav a:not(.logo){font-family:var(--f-mono);font-size:14px;letter-spacing:0;text-transform:lowercase}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18vh 5vw 10vh;max-width:1280px;width:100%;margin:auto}
.tag{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:28px}
h1{font-family:var(--f-display);font-weight:800;-webkit-text-stroke:.02em currentColor;font-size:clamp(96px,26vw,380px);line-height:.9;letter-spacing:-.05em;display:flex;align-items:baseline;flex-wrap:nowrap}
h1 .w{display:inline-block;transition:filter .15s linear}
h1 .xx{position:relative;display:inline-block;line-height:0;margin:0 .03em}
h1 .xx img{display:block;height:.72em;width:auto;margin-top:-.01em;margin-bottom:-.01em;animation:flick 8s infinite}
@keyframes flick{0%,6%{opacity:1}6.3%{opacity:.1}7%{opacity:1}7.6%{opacity:.25}8.2%,40%{opacity:1}40.4%{opacity:.15}41.2%{opacity:1}76%{opacity:1}76.4%{opacity:.1}77.2%,100%{opacity:1}}
.lead{margin-top:5vh;max-width:900px;font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.6vw,52px);line-height:1.12;letter-spacing:-.04em}
.sub{margin-top:22px;max-width:560px;font-family:var(--f-mono);font-size:clamp(12px,1.3vw,15px);letter-spacing:.02em;color:var(--mute)}
.pill{font-family:var(--f-mono);font-size:14px;text-transform:lowercase}
footer{padding:30px 5vw;color:var(--mute);font-family:var(--f-mono);font-size:13px;text-transform:lowercase;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;border-top:1px solid var(--line)}
.rv{opacity:0;transform:translateY(24px);filter:blur(12px);animation:rv 1s cubic-bezier(.16,1,.3,1) forwards}
@keyframes rv{to{opacity:1;transform:none;filter:none}}
@media (max-width:600px){nav a:not(.logo){display:none}}
@media (prefers-reduced-motion:reduce){.rv{animation:none;opacity:1;transform:none;filter:none}h1 .xx img{animation:none}}

</style>
